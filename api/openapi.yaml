openapi: 3.0.3
servers:
- url: https://virtserver.swaggerhub.com/<ACCOUNT>/knigamag-api/1.0.0
  description: SwaggerHub API Auto Mocking (заменить <ACCOUNT> на имя аккаунта)
- url: http://localhost:8080
  description: Локальный Mock-сервер (api/mock_server.py)
- url: https://api.knigamag.by
  description: Промышленный сервер (план развёртывания)
info:
  title: КнигаМаг — REST API
  version: 1.0.0
  description: 'Спецификация REST API книжного онлайн-магазина «КнигаМаг» (knigamag.by). Лабораторная работа № 4, задания
    1–4, группа 13. Входные данные — требования, варианты использования и ER-модель лабораторной работы № 3. Стек: Python
    3.12 / Django 5 / Django REST Framework.'
  contact:
    email: student@bsu.by
    name: Студент группы 13
  license:
    name: Учебный проект БГУ
tags:
- name: auth
  description: Регистрация, вход, JWT-токены и профиль
- name: catalog
  description: Каталог книг и справочники
- name: reviews
  description: Отзывы и оценки
- name: cart
  description: Корзина покупателя
- name: favorites
  description: Избранное
- name: orders
  description: Заказы и их статусы
- name: payments
  description: Оплата и webhook платёжного шлюза
- name: preorders
  description: Предзаказы новинок
- name: subscriptions
  description: Подписки на издательства
paths:
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Регистрация пользователя
      description: Создаёт учётную запись с ролью customer и возвращает пару JWT-токенов.
      operationId: post_auth_register
      security:
      - {}
      requestBody:
        required: true
        description: Тело запроса RegisterRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: maria
              email: maria@example.com
              password: Str0ngPass!
              phone: '+375291234567'
      responses:
        '201':
          description: Ресурс успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.access
                refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh
                tokenType: Bearer
                expiresIn: 3600
        '400':
          description: Некорректный JSON или неверные параметры запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: '400'
                message: Некорректный JSON или неверные параметры запроса
                details: []
        '409':
          description: 'Конфликт: нарушена уникальность или бизнес-правило'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: '409'
                message: 'Конфликт: нарушена уникальность или бизнес-правило'
                details: []
        '422':
          description: Ошибка валидации полей тела запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: '422'
                message: Ошибка валидации полей тела запроса
                details: []
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: '500'
                message: Внутренняя ошибка сервера
                details: []
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Вход в систему
      description: Проверяет учётные данные и выдаёт access- и refresh-токены.
      operationId: post_auth_login
      security:
      - {}
      requestBody:
        required: true
        description: Тело запроса LoginRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: maria
              password: Str0ngPass!
      responses:
        '200':
          description: Запрос выполнен, ресурс возвращён или обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.access
