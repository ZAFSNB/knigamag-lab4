components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT-токен из POST /api/v1/auth/login
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: HMAC-SHA256 подпись тела webhook
  schemas:
    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
      example:
        id: 1
        name: manager
        permissions:
        - orders.change
        - orders.view
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
      example:
        id: 2
        username: maria
        email: maria@example.com
        role: customer
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT-токен доступа
        refreshToken:
          type: string
          description: JWT-токен обновления
        tokenType:
          type: string
        expiresIn:
          type: integer
      example:
        accessToken: eyJhbGciOiJIUzI1NiJ9.access
        refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh
        tokenType: Bearer
        expiresIn: 3600
    Author:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        biography:
          type: string
      example:
        id: 1
        firstName: Роберт
        lastName: Мартин
        biography: Автор «Чистого кода».
    Publisher:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
      example:
        id: 1
        name: Питер
        address: Минск, ул. Примерная, 1
    Topic:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      example:
        id: 1
        name: Программирование
    Book:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        isbn:
          type: string
          description: ISBN-13 без дефисов
        price:
          type: number
          format: double
          description: Цена, BYN
        rating:
          type: number
          format: double
          description: Оценка 1–5 / средний рейтинг
        availability:
          type: string
          enum:
          - in_stock
          - out_of_stock
          - preorder
        description:
          type: string
        authorId:
          type: integer
        publisherId:
          type: integer
        topicId:
          type: integer
        createdAt:
          type: string
          format: date-time
      example:
        id: 1
        title: Чистый код
        isbn: '9780132350884'
        price: 52.0
        rating: 4.8
        availability: in_stock
        description: Руководство по написанию чистого кода.
        authorId: 1
        publisherId: 1
        topicId: 1
        createdAt: '2026-09-01T10:00:00Z'
    Review:
      type: object
      properties:
        id:
          type: integer
        bookId:
          type: integer
        userId:
          type: integer
        text:
          type: string
        rating:
          type: integer
          description: Оценка 1–5 / средний рейтинг
        createdAt:
          type: string
          format: date-time
        moderated:
          type: boolean
      example:
        id: 7
        bookId: 1
        userId: 2
        text: Полезная книга, рекомендую.
        rating: 5
        createdAt: '2026-10-05'
        moderated: true
    Cart:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        total:
          type: number
          format: double
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              bookId:
                type: integer
              quantity:
                type: integer
                description: Количество экземпляров (не менее 1)
              price:
                type: number
                format: double
                description: Цена, BYN
      example:
        id: 3
        userId: 2
        total: 84.5
        items:
        - id: 11
          bookId: 1
          quantity: 1
          price: 52.0
    CartItem:
      type: object
      properties:
        id:
          type: integer
        bookId:
          type: integer
        quantity:
          type: integer
          description: Количество экземпляров (не менее 1)
        price:
          type: number
          format: double
          description: Цена, BYN
      example:
        id: 11
        bookId: 1
        quantity: 1
        price: 52.0
    Favorite:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        bookId:
          type: integer
        addedAt:
          type: string
      example:
        id: 5
        userId: 2
        bookId: 1
        addedAt: '2026-10-11'
    Subscription:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        publisherId:
          type: integer
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
      example:
        id: 4
        userId: 2
        publisherId: 1
        email: maria@example.com
        createdAt: '2026-10-11T09:00:00Z'
    Preorder:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        bookId:
          type: integer
        status:
          type: string
          enum:
          - awaiting
          - arrived
          - charged
          - cancelled
        createdAt:
          type: string
          format: date-time
        arrivedAt:
          type: string
          nullable: true
          format: date-time
      example:
        id: 6
        userId: 2
        bookId: 2
        status: awaiting
        createdAt: '2026-10-12T12:00:00Z'
        arrivedAt: null
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        bookId:
          type: integer
        quantity:
          type: integer
          description: Количество экземпляров (не менее 1)
        price:
          type: number
          format: double
          description: Цена, BYN
      example:
        id: 21
        orderId: 1024
        bookId: 1
        quantity: 1
        price: 52.0
    Order:
      type: object
      properties:
        id:
          type: integer
        number:
          type: string
        userId:
          type: integer
        address:
          type: string
        total:
          type: number
          format: double
        status:
          type: string
          enum:
          - pending_payment
          - paid
          - assembled
          - in_delivery
          - delivered
          - cancelled
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              orderId:
                type: integer
              bookId:
                type: integer
              quantity:
                type: integer
                description: Количество экземпляров (не менее 1)
              price:
                type: number
                format: double
                description: Цена, BYN
      example:
        id: 1024
        number: KM-1024
        userId: 2
        address: Минск, пр. Независимости, 4
        total: 84.5
        status: paid
        createdAt: '2026-10-13T14:20:00Z'
        items:
