        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: '500'
                message: Внутренняя ошибка сервера
                details: []
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Обновление токена доступа
      description: Выдаёт новую пару токенов по действительному refresh-токену; старый токен отзывается.
      operationId: post_auth_refresh
      security:
      - {}
      requestBody:
        required: true
        description: Тело запроса RefreshRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh
      responses:
        '200':
          description: Запрос выполнен, ресурс возвращён или обновлён
          content:
            application/json:
              schema:
