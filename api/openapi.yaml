        '400':
          description: Некорректный JSON или неверные параметры запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: '400'
                message: Некорректный JSON или неверные параметры запроса
                details: []
        '401':
          description: Отсутствует, истёк или недействителен JWT-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: '401'
                message: Отсутствует, истёк или недействителен JWT-токен
                details: []
        '422':
          description: Ошибка валидации полей тела запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: '422'
                message: Ошибка валидации полей тела запроса
                details: []
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: '500'
                message: Внутренняя ошибка сервера
                details: []
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Выход из системы
      description: Отзывает refresh-токен; access-токен остаётся действительным до истечения срока.
      operationId: post_auth_logout
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: Тело запроса RefreshRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh
      responses:
        '204':
          description: Ресурс удалён, тело ответа отсутствует
        '400':
          description: Некорректный JSON или неверные параметры запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: '400'
