  /api/v1/books:
    get:
      tags:
      - catalog
      summary: Список книг с фильтрацией и пагинацией
      description: Возвращает страницу коллекции книг; поддерживает поиск, фильтры и сортировку (ФТ-1, ФТ-2).
      operationId: get_books
      parameters:
      - name: q
        in: query
        required: false
        description: Поиск по названию, автору, ISBN
        schema:
          type: string
      - name: authorId
        in: query
        required: false
        description: Фильтр по автору
        schema:
          type: string
      - name: publisherId
        in: query
        required: false
        description: Фильтр по издательству
        schema:
          type: string
      - name: topicId
        in: query
        required: false
        description: Фильтр по тематике
        schema:
          type: string
      - name: minPrice
        in: query
        required: false
        description: Минимальная цена
        schema:
          type: string
      - name: maxPrice
        in: query
        required: false
        description: Максимальная цена
        schema:
          type: string
      - name: availability
        in: query
        required: false
        description: 'Наличие: in_stock / out_of_stock / preorder'
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: 'Сортировка: relevance, price, rating, novelty'
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Номер страницы (по умолчанию 1)
        schema:
          type: string
      - name: perPage
        in: query
        required: false
        description: Размер страницы (по умолчанию 20)
        schema:
          type: string
      security:
      - {}
      responses:
        '200':
          description: Запрос выполнен, ресурс возвращён или обновлён
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
                  page:
                    type: integer
                    example: 1
                  perPage:
                    type: integer
                    example: 20
                  total:
                    type: integer
                    example: 1
              example:
                items:
                - id: 1
                  title: Чистый код
                  isbn: '9780132350884'
                  price: 52.0
                  rating: 4.8
                  availability: in_stock
                  description: Руководство по написанию чистого кода.
                  authorId: 1
                  publisherId: 1
                  topicId: 1
                  createdAt: '2026-09-01T10:00:00Z'
                page: 1
                perPage: 20
                total: 1
        '400':
          description: Некорректный JSON или неверные параметры запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: '400'
                message: Некорректный JSON или неверные параметры запроса
                details: []
        '404':
          description: Ресурс или связанная сущность не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: '404'
                message: Ресурс или связанная сущность не найдены
                details: []
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: '500'
                message: Внутренняя ошибка сервера
                details: []
        '503':
          description: Сервис поиска временно недоступен
          content:
